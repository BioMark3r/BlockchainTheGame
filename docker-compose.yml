# Blockchain: The Game — Docker Compose
#
# Quick start (local and remote):
#   docker compose up --build
#   Then open http://your-server-ip in your browser.
#
# All traffic (HTTP + WebSocket) goes through port 80 via nginx.
# No need to open port 3001 — the server is internal to Docker networking.
#
# HTTPS / custom domain:
#   Put a reverse proxy (Caddy, Traefik, nginx) in front and set
#   VITE_WS_URL=wss://your-domain.com as a build arg if needed.

services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    # Port 3001 is internal only — nginx proxies /ws to the server container.
    # Do NOT expose 3001 externally; all client traffic goes through port 80.
    environment:
      PORT: "3001"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      # VITE_WS_URL is not needed — the client connects via /ws on the same
      # host and port it was served from (proxied by nginx to the server).
      # Only set this if your WebSocket server is on a completely different host.
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
