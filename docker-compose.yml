# Blockchain: The Game — Docker Compose
#
# Quick start (local):
#   docker compose up --build
#   Then open http://localhost in your browser.
#
# Remote deployment:
#   Set VITE_WS_URL to your server's public WebSocket URL before building:
#   VITE_WS_URL=ws://your-server-ip:3001 docker compose up --build
#
# The client is served by nginx on port 80.
# The WebSocket server runs on port 3001.

services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      # VITE_WS_URL is optional. When omitted, the client automatically connects
      # to the same hostname it was served from on port 3001, which works for
      # local and remote access without rebuilding.
      # Override only if your WebSocket server is on a different host:
      #   args:
      #     VITE_WS_URL: "wss://your-server-domain.com"
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
